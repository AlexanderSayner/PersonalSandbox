server.port=8087

# Database Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/userdb
spring.datasource.username=libraryuser
spring.datasource.password=librarypass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKeyMustBeLongerThan256BitsForHS512Algorithm}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.example.userservice=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info