server.port=8087

# Database Configuration
spring.datasource.url=jdbc:postgresql://${USER_DATABASE_HOST:postgres}:${USER_DATABASE_PORT:5432}/userdb
spring.datasource.username=${USER_DATABASE_USERNAME:libraryuser}
spring.datasource.password=${USER_DATABASE_PWD:librarypass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKeyMustBeLongerThan256BitsForHS512Algorithm}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.example.userservice=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info