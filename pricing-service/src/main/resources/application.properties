# Server Configuration
server.port=8085

# Application Name
spring.application.name=pricing-service

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://postgres:5432/pricingdb
spring.datasource.username=libraryuser
spring.datasource.password=librarypass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# gRPC Server Configuration
grpc.server.port=9091
grpc.server.in-process-server-name=test
grpc.server.security-enabled=false

# gRPC Client Configuration for Bookshop Service
grpc.client.bookshop-service.address=static://bookshop-service:9090
grpc.client.bookshop-service.negotiation-type=PLAINTEXT