# Server configuration
server.port=8080

# JVM and memory settings for string optimization
# These would typically be set as JVM arguments:
# -XX:+UseG1GC
# -XX:+G1UseStringDeduplication
# -XX:MaxGCPauseMillis=200

# Application-specific settings
app.string-processing.max-length=1000000
app.string-processing.batch-size=10000

# Logging
logging.level.com.example.stringdemo=DEBUG
logging.level.org.springframework.web=INFO