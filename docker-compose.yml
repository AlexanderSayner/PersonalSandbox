services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app-network

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-statistics
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: statistics_db
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - app-network

  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: librarydb
      POSTGRES_USER: libraryuser
      POSTGRES_PASSWORD: librarypass
    ports:
      - "6543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/create-databases.sql:/docker-entrypoint-initdb.d/create-databases.sql
    networks:
      - app-network

  adminer:
    image: adminer
    container_name: adminer-db-ui
    ports:
      - "8081:8080"
    environment:
      - ADMINER_DEFAULT_DB_DRIVER=pgsql
      - ADMINER_DEFAULT_DB_HOST=postgres
      - ADMINER_DEFAULT_DB_NAME=librarydb
      - ADMINER_DEFAULT_DB_USER=libraryuser
      - ADMINER_DEFAULT_DB_PASS=librarypass
    depends_on:
      - postgres
    networks:
      - app-network

  javaee-app:
    build:
      context: ./javaee-graphql-project
      dockerfile: Dockerfile
    container_name: javaee-graphql-app
    ports:
      - "8090:8080"
    depends_on:
      - postgres
    environment:
      - POSTGRES_DB=librarydb
      - POSTGRES_USER=libraryuser
      - POSTGRES_PASSWORD=librarypass
    networks:
      - app-network
    restart: unless-stopped

  # Spring Reviewer Service
  reviewer-service:
    build:
      context: ./spring-reviewer-service
      dockerfile: Dockerfile
    container_name: reviewer-service
    ports:
      - "8082:8080"
    depends_on:
      - javaee-app
      - redis
      - mongodb
    environment:
      - JAVAEE_APP_URL=http://javaee-app:8080
      - REDIS_HOST=redis
      - MONGODB_HOST=mongodb
    networks:
      - app-network
    restart: unless-stopped

  # Redis for caching books
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: unless-stopped

  # MongoDB for storing reviews
  mongodb:
    image: mongo:8.2
    container_name: mongodb-reviews
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: rootuser
      MONGO_INITDB_ROOT_PASSWORD: rootpwd
    volumes:
      - mongodb_data:/data/db
      - ./init-scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - app-network
    restart: unless-stopped

  bookshop-service:
    build:
      context: ./bookshop-service
      dockerfile: Dockerfile
    container_name: bookshop-service
    ports:
      - "8083:8080"
    depends_on:
      - postgres
      - javaee-app
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/bookshopdb
      - SPRING_DATASOURCE_USERNAME=libraryuser
      - SPRING_DATASOURCE_PASSWORD=librarypass
      - JAVAEE_SERVICE_ADDRESS=javaee-app:8090
    networks:
      - app-network
    restart: unless-stopped

  cassandra:
    image: cassandra:5.0
    container_name: workshop-cassandra
    ports:
      - "9042:9042"
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES;'" ]
      interval: 30s
      timeout: 10s
      retries: 5

  workshop-service:
    build:
      context: ./workshop-service
      dockerfile: Dockerfile
    container_name: workshop-service
    ports:
      - "8084:8081"
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      - SPRING_CASSANDRA_CONTACT_POINTS=cassandra
      - SPRING_CASSANDRA_LOCAL_DATACENTER=datacenter1
      - GRPC_CLIENT_BOOKSHOP_SERVICE_ADDRESS=static://bookshop-service:9090
    restart: on-failure

  # Pricing Service
  pricing-service:
    build:
      context: ./pricing-service
      dockerfile: Dockerfile
    container_name: pricing-service
    ports:
      - "8085:8085"
      - "9091:9091"
    depends_on:
      - postgres
      - bookshop-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/pricingdb
      - SPRING_DATASOURCE_USERNAME=libraryuser
      - SPRING_DATASOURCE_PASSWORD=librarypass
      - GRPC_CLIENT_BOOKSHOP_SERVICE_ADDRESS=static://bookshop-service:9090
    networks:
      - app-network
    restart: unless-stopped

  # Statistics Service
  statistics-service:
    build:
      context: ./statistics-service
      dockerfile: Dockerfile
    container_name: statistics-service
    ports:
      - "8086:8083"
    depends_on:
      - kafka
      - clickhouse
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CLICKHOUSE_URL=jdbc:clickhouse://clickhouse:8123/statistics_db
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=password
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
  cassandra_data:
  clickhouse_data:

networks:
  app-network:
    driver: bridge