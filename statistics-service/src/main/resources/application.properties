server.port=8083
spring.application.name=statistics-service

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=statistics-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ClickHouse Configuration
spring.datasource.url=${CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/default}
spring.datasource.username=${CLICKHOUSE_USER:default}
spring.datasource.password=${CLICKHOUSE_PASSWORD:}
spring.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver

# GraphQL Configuration
spring.graphql.graphiql.enabled=true
spring.graphql.path=/graphql
spring.graphql.graphiql.path=/graphiql

# Actuator and Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus,graphql
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoint.graphql.enabled=true

# Logging
logging.level.org.sandbox.statistics=INFO
logging.level.org.springframework.kafka=INFO
logging.level.org.springframework.graphql=DEBUG